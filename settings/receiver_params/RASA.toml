# RASA Receiver Parameters
#
# Frame layout (per scan of channel 26): 800-bit (50-word) minor frame =
# 2 frame-sync words + 48 channel words. The hardware uses 4-channel cards;
# RASA populates only 3 of the 4 channels per card:
#   L (Left), R (Right), C (Combine), <unused 4th card channel>
# The unused 4th channel of every card carries no AGC sample. It is listed
# explicitly below as [EMPTY] (Word 4, 8, 12, ...) so the Word numbering stays
# contiguous and does not appear to skip a word; the application ignores every
# [EMPTY] entry, so these never become plotted channels.
#
# Frame sync / mask / bits-per-frame are NOT defined here — receiver-parameter
# files carry only the word map and calibration. The frame sync defaults come
# from settings/framesync_patterns/framesync_rcvr_default.toml.

[Parameters]
Polarity = 1
Slope = 2
Scale = "10"

[Time]
ExtractAllTime = true
SampleRate = 0

[Receivers]
Count = 12
ChannelsPerReceiver = 3

[L_RCVR1]
Word = 1

[R_RCVR1]
Word = 2

[C_RCVR1]
Word = 3

[EMPTY]
Word = 4

