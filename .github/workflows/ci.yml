name: CI

# Build the app and run the full Qt Test suite on every push to main and every PR.
# Runs on a SELF-HOSTED Windows runner (label: tmdqa) that already has the MSVC
# 2022 toolchain + Qt msvc2022_64 kit installed and the large .ch10 fixtures on
# disk — so there is no per-run Qt download and the integration suites actually
# run. The toolchain is set up by dot-sourcing scripts/env.ps1 (vcvars + Qt on
# PATH); app built under build/, tests built in-source under tests/ (the exe must
# sit one level below tests/ or the data-file fixtures don't resolve).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Qt version for this workflow. env.ps1 respects an existing QT_VERSION, so this
# stays the single knob; it must match the Qt kit installed on the runner.
env:
  QT_VERSION: '6.10.3'

jobs:
  build-and-test:
    runs-on: [self-hosted, windows, tmdqa]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Do NOT let checkout run `git clean -ffdx`: it would delete the
          # gitignored build artifacts we clean ourselves below AND could follow
          # the tests\data fixtures junction. We reset the workspace explicitly.
          clean: false

      - name: Prepare workspace (clean artifacts + link fixtures)
        shell: pwsh
        run: |
          # Persistent-runner hygiene: remove stale build outputs (NOT tests\data)
          # so a leftover .qmake.stash or prior-run object files can't break the
          # build (QMAKE_MSC_VER / C1041). tests\data is handled as a junction below.
          foreach ($p in 'build', 'tests\debug', 'tests\release', 'tests\output') {
            if (Test-Path $p) { Remove-Item $p -Recurse -Force }
          }
          Get-ChildItem -Recurse -Force -Include '.qmake.stash' -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue

          # The large .ch10 fixtures are gitignored, so absent from the checkout.
          # Junction tests\data to the machine-local copy (path in the runner's
          # .env as TMDQA_CH10_DATA) so the four integration suites run the full
          # 325 instead of skipping. Delete only the junction link (not its target)
          # before re-creating it.
          if (Test-Path tests\data) { (Get-Item tests\data -Force).Delete() }
          if ($env:TMDQA_CH10_DATA -and (Test-Path $env:TMDQA_CH10_DATA)) {
            New-Item -ItemType Junction -Path tests\data -Target $env:TMDQA_CH10_DATA | Out-Null
            Write-Host "Linked tests\data -> $env:TMDQA_CH10_DATA"
          } else {
            Write-Host "::warning::TMDQA_CH10_DATA not set/found on the runner — integration suites will skip."
          }

      - name: Toolchain versions
        shell: pwsh
        run: |
          . .\scripts\env.ps1
          qmake --version
          cl 2>&1 | Select-Object -First 1

      - name: Build app (Debug)
        shell: pwsh
        run: |
          . .\scripts\env.ps1
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Set-Location build
          qmake ..\tmDataQualityAnalyzer.pro -spec win32-msvc 'CONFIG+=debug'
          nmake -f Makefile.Debug 2>&1 | Tee-Object -FilePath app_build.log
          if ($LASTEXITCODE -ne 0) { throw "App build failed ($LASTEXITCODE)" }

      - name: Zero-warning gate
        shell: pwsh
        run: |
          # The whole build must be warning-free. The vendored third-party libs
          # (lib/irig106, lib/qcustomplot) are compiled without warnings via
          # thirdparty.pri, so any remaining 'warning C####' is real app code.
          $warns = Select-String -Path build\app_build.log -Pattern 'warning [A-Z]\d+'
          if ($warns) {
            Write-Host "Compiler warnings found:"
            $warns | ForEach-Object { Write-Host $_.Line }
            throw "Build is not warning-clean"
          }
          Write-Host "No warnings."

      - name: Build tests (Debug, in-source)
        shell: pwsh
        run: |
          . .\scripts\env.ps1
          Set-Location tests
          qmake tests.pro -spec win32-msvc 'CONFIG+=debug'
          nmake -f Makefile.Debug
          if ($LASTEXITCODE -ne 0) { throw "Test build failed ($LASTEXITCODE)" }

      - name: Run full test suite
        shell: pwsh
        run: |
          # env.ps1 puts the Qt msvc kit's bin on PATH so the test exe can load
          # Qt6*.dll at runtime (each step is a fresh shell — PATH doesn't carry over).
          . .\scripts\env.ps1
          Set-Location tests
          # The harness writes results to tests/output/ (gitignored); create it or
          # the exe bails before running any test.
          New-Item -ItemType Directory -Force -Path output | Out-Null
          .\debug\tmDataQualityAnalyzer_tests.exe
          $code = $LASTEXITCODE
          $pass = 0; $fail = 0; $skip = 0
          if (Test-Path output\results.txt) {
            $pass = (Select-String -Path output\results.txt -Pattern '^PASS').Count
            $fail = (Select-String -Path output\results.txt -Pattern '^FAIL').Count
            $skip = (Select-String -Path output\results.txt -Pattern '^SKIP').Count
          }
          Write-Host "Results: $pass passed, $fail failed, $skip skipped (exit $code)"
          if ($code -ne 0) { throw "Test suite exited non-zero ($code)" }
          if ($fail -gt 0)  { throw "$fail test(s) failed" }
          # Fixtures are linked on this runner, so the .ch10 integration suites run
          # (full green baseline is 325). A count far below that means the fixtures
          # junction failed and the integration suites silently skipped — fail loudly.
          $minExpected = 320
          if ($pass -lt $minExpected) {
            throw "Only $pass tests passed (expected >= $minExpected) — the fixtures didn't link or the suite aborted"
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/output/results.txt
          if-no-files-found: ignore
