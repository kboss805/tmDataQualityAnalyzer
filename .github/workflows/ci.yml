name: CI

# Build the native core and run its doctest suite, the managed library's tests and the
# Avalonia application's tests on every push to main and every PR, in one job on a
# GitHub-hosted Windows runner (plan step 6.4).
#
# One job, on a machine that has never had Qt. Until 6.4 there were three: a self-hosted
# runner (preferred when online), a hosted fallback, and core-without-qt beside either,
# which proved the core and the app need no Qt (plan step 2.4). The self-hosted machine
# still held the Qt kit the deleted application needed, so only the hosted job could prove
# that; with the Qt application gone (6.1, 6.2) it is the only job, and a step before the
# build still fails if the image ever gains a Qt, so the proof cannot quietly lapse. The
# small .ch10 fixtures are committed, so every suite runs here. The heavy PRN throughput
# benchmark is opt-in (TMDQA_RUN_HEAVY_BENCH) and needs the full recording, which is not
# committed: it is run at release (eng\run_throughput_bench.ps1), not here.
#
# Windows steps use `shell: powershell` (Windows PowerShell 5.1), NOT `pwsh`: it is the
# shell the build scripts are written for and tested under (they also run under 7), and
# what the release scripts run under on the development machine.
#
# KEEP THIS FILE PURE ASCII. Windows PowerShell 5.1 reads the temp script GitHub
# writes for each step as Windows-1252, not UTF-8, so a UTF-8 em-dash/arrow decodes
# into bytes that include a smart quote - which 5.1 treats as a string delimiter and
# the step dies with "The string is missing the terminator". Use -, ->, "..." only.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # windows-2022, not windows-latest: the build is pinned to Visual Studio 2022 (MSVC 14.44, v143; eng\env.ps1
    # asks vswhere for [17.0,18.0)), which is what releases are built with. windows-latest carries Visual Studio 2026
    # (MSVC 14.51), so a job there never builds with the release compiler.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release consistency (version literals)
        shell: powershell
        run: |
          # Five user-facing files carry the version as prose; nothing derives them
          # from AppVersion, and each has shipped stale. Needs no toolchain, so it
          # runs before the build and fails fast. -ReleaseMode is deliberately NOT
          # passed: an "Unreleased" changelog section is correct between releases and
          # is only an error at packaging time (build_avalonia_package.ps1 passes it there).
          powershell -ExecutionPolicy Bypass -File eng\check_release_consistency.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Set up MSVC (cl / msbuild / dumpbin / mt)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: 2022

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Toolchain versions
        shell: powershell
        run: |
          # PS 5.1 turns native-tool stderr into a terminating NativeCommandError
          # (e.g. cl's banner). Failures are gated by explicit $LASTEXITCODE checks.
          $ErrorActionPreference = 'Continue'
          dotnet --version
          cmd /c "cl 2>&1" | Select-Object -First 1
          Write-Host "Visual Studio $env:VisualStudioVersion, MSVC $env:VCToolsVersion"
          # The pin env.ps1 holds locally ([17.0,18.0)): fail rather than quietly build with another compiler.
          if ($env:VisualStudioVersion -ne '17.0') {
            throw "CI must build with Visual Studio 2022 (17.0), as releases are, and got '$env:VisualStudioVersion'"
          }
          # cl exits non-zero when given no input file, and GitHub appends
          # "exit $LASTEXITCODE" to powershell steps, so end it explicitly successful.
          exit 0

      - name: Prove there is no Qt on this machine
        shell: powershell
        run: |
          # Runs after the toolchain steps, so the PATH they built is the one checked. Looks for
          # Qt the ways a build could find it: a qmake or a Qt DLL on PATH, a Qt variable, an
          # install in the usual places.
          $ErrorActionPreference = 'Continue'
          $found = @()
          foreach ($tool in 'qmake', 'qmake6', 'qtpaths', 'windeployqt') {
            $c = Get-Command $tool -ErrorAction SilentlyContinue
            if ($c) { $found += "$tool on PATH: $($c.Source)" }
          }
          foreach ($dir in ($env:PATH -split ';' | Where-Object { $_ -and (Test-Path -LiteralPath $_) })) {
            Get-ChildItem -LiteralPath $dir -Filter 'Qt6Core*.dll' -ErrorAction SilentlyContinue |
              ForEach-Object { $found += "Qt DLL on PATH: $($_.FullName)" }
          }
          Get-ChildItem env: | Where-Object { $_.Name -match '^(QTDIR|QT_ROOT|QT_ROOT_DIR|QT_PLUGIN_PATH|Qt6_DIR)$' } |
            ForEach-Object { $found += "variable $($_.Name)=$($_.Value)" }
          # Each base must be set: an empty one would make "\Qt", which resolves to the drive's root.
          $roots = @('C:\Qt', 'D:\a\Qt')
          foreach ($base in $env:USERPROFILE, $env:RUNNER_WORKSPACE) { if ($base) { $roots += (Join-Path $base 'Qt') } }
          foreach ($root in $roots) {
            if (Test-Path -LiteralPath $root) { $found += "install folder: $root" }
          }
          if ($found.Count -gt 0) {
            $found | ForEach-Object { Write-Host "  $_" }
            throw "This job must run where Qt is not installed, and found $($found.Count) trace(s) of it"
          }
          Write-Host 'No Qt on this machine: no qmake or Qt DLL on PATH, no Qt variable, no install folder.'

      - name: Build native core (tmdq_core.dll)
        shell: powershell
        run: |
          # The core, built by MSBuild (tmdq.sln), then checked: zero warnings, and the DLL's
          # imports on an allow-list. The scripts dot-source env.ps1 only when msbuild / mt are
          # missing; msvc-dev-cmd put them on PATH.
          # PS 5.1 turns native-tool stderr into a terminating NativeCommandError, so failures
          # are gated by explicit $LASTEXITCODE checks.
          $ErrorActionPreference = 'Continue'
          foreach ($cfg in 'Debug', 'Release') {
            powershell -ExecutionPolicy Bypass -File eng\build_core_dll.ps1 -Configuration $cfg
            if ($LASTEXITCODE -ne 0) { throw "tmdq_core.dll ($cfg) failed the build or its import check" }
          }

      - name: Native tests (doctest)
        shell: powershell
        run: |
          # The core's own tests: doctest, built by MSBuild. The script requires zero compiler
          # warnings and no Qt import, then runs them.
          $ErrorActionPreference = 'Continue'
          powershell -ExecutionPolicy Bypass -File eng\test_native.ps1 -Configuration Release
          if ($LASTEXITCODE -ne 0) { throw "the native tests failed" }

      - name: Managed tests (TmDq.Core against the native DLL)
        shell: powershell
        run: |
          # The C# library over the ABI and its xunit tests, run against the Release tmdq_core.dll built
          # above. The script builds with warnings as errors and merges the UTF-8 code-page manifest
          # into the test exe (mt.exe).
          $ErrorActionPreference = 'Continue'
          powershell -ExecutionPolicy Bypass -File eng\test_dotnet.ps1 -Configuration Release
          if ($LASTEXITCODE -ne 0) { throw "the managed tests failed" }

      - name: App tests (Avalonia, headless)
        shell: powershell
        run: |
          # The Avalonia application (src/TmDq.App) and its tests on the headless platform, which needs
          # no window system; the script prints the account and session it runs as, so the log records it.
          $ErrorActionPreference = 'Continue'
          powershell -ExecutionPolicy Bypass -File eng\test_app.ps1 -Configuration Release
          if ($LASTEXITCODE -ne 0) { throw "the app tests failed" }
