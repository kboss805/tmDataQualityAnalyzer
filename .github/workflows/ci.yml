name: CI

# Build the app and run the full Qt Test suite on every push to main and every PR.
# Mirrors the local build-and-test workflow: Qt 6.10.2 + MinGW, qmake + mingw32-make,
# app built under build/, tests built in-source under tests/ (the exe must sit one
# level below tests/ or the data-file fixtures don't resolve).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.10.2 (MinGW) + toolchain
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          host: windows
          target: desktop
          arch: win64_mingw
          # Qt SVG (Qt6Svg) ships in the base win64_mingw package in Qt 6, so it is
          # NOT a selectable --modules entry (aqt rejects it). printsupport,
          # widgets, and concurrent are likewise part of qtbase.
          tools: tools_mingw1310
          cache: true

      - name: Put MinGW on PATH
        shell: pwsh
        run: |
          # install-qt-action installs the MinGW tool under $IQTA_TOOLS. Expose its
          # bin so g++ / mingw32-make resolve, and so the test exe finds the MinGW
          # runtime DLLs at run time (Qt's own bin is already on PATH via the action).
          $mingwBin = Join-Path $env:IQTA_TOOLS 'mingw1310_64\bin'
          if (-not (Test-Path $mingwBin)) {
            Write-Host "Expected MinGW bin not found at $mingwBin; contents of IQTA_TOOLS:"
            Get-ChildItem $env:IQTA_TOOLS -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
            throw "MinGW toolchain not found"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $mingwBin
          Write-Host "Added to PATH: $mingwBin"

      - name: Toolchain versions
        shell: pwsh
        run: |
          qmake --version
          g++ --version
          mingw32-make --version | Select-Object -First 1

      - name: Build app (Debug)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Set-Location build
          qmake ..\tmDataQualityAnalyzer.pro -spec win32-g++ 'CONFIG+=debug'
          mingw32-make -f Makefile.Debug -j $env:NUMBER_OF_PROCESSORS 2>&1 | Tee-Object -FilePath app_build.log
          if ($LASTEXITCODE -ne 0) { throw "App build failed ($LASTEXITCODE)" }

      - name: Zero-warning gate
        shell: pwsh
        run: |
          # The whole build must be warning-free. The vendored third-party libs
          # (lib/irig106, lib/qcustomplot) are compiled without -Wall -Wextra via
          # thirdparty.pri, so any 'warning:' remaining is real app code and fails CI.
          $warns = Select-String -Path build\app_build.log -Pattern 'warning:'
          if ($warns) {
            Write-Host "Compiler warnings found:"
            $warns | ForEach-Object { Write-Host $_.Line }
            throw "Build is not warning-clean"
          }
          Write-Host "No warnings."

      - name: Build tests (Debug, in-source)
        shell: pwsh
        run: |
          Set-Location tests
          qmake tests.pro -spec win32-g++ 'CONFIG+=debug'
          mingw32-make -f Makefile.Debug -j $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) { throw "Test build failed ($LASTEXITCODE)" }

      - name: Run full test suite
        shell: pwsh
        run: |
          Set-Location tests
          # The harness writes results to tests/output/ (gitignored, so absent on a
          # fresh checkout); create it or the exe bails before running any test.
          New-Item -ItemType Directory -Force -Path output | Out-Null
          .\debug\tmDataQualityAnalyzer_tests.exe
          $code = $LASTEXITCODE
          $pass = 0; $fail = 0; $skip = 0
          if (Test-Path output\results.txt) {
            $pass = (Select-String -Path output\results.txt -Pattern '^PASS').Count
            $fail = (Select-String -Path output\results.txt -Pattern '^FAIL').Count
            $skip = (Select-String -Path output\results.txt -Pattern '^SKIP').Count
          }
          Write-Host "Results: $pass passed, $fail failed, $skip skipped (exit $code)"
          if ($code -ne 0) { throw "Test suite exited non-zero ($code)" }
          if ($fail -gt 0)  { throw "$fail test(s) failed" }
          # Guard against a silently aborted / poisoned harness reporting success
          # with almost nothing run. The fixture-dependent integration suites skip
          # on CI (the large .ch10 files are gitignored), leaving ~230+ tests; a
          # count far below that means the run didn't actually execute the suite.
          $minExpected = 200
          if ($pass -lt $minExpected) {
            throw "Only $pass tests passed (expected >= $minExpected) — the suite aborted or the harness was poisoned"
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/output/results.txt
          if-no-files-found: ignore
