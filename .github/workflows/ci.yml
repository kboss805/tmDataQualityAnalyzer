name: CI

# Build the app and run the Qt Test suite on every push to main and every PR.
#
# Runner selection with fallback:
#   - Preferred: a SELF-HOSTED Windows runner (label: tmdqa) that has the MSVC 2022
#     toolchain + Qt msvc2022_64 kit and the FULL-SIZE .ch10 recordings on disk, so
#     there is no per-run Qt download and the integration suites run.
#   - Fallback: the GitHub-hosted windows-latest runner (provisions Qt + MSVC per
#     run). The small .ch10 fixtures are committed to the repo, so the integration
#     suites run here too, so both runners report the same totals, with no skips.
#     The heavy PRN throughput benchmark lives in the native doctest suite, is
#     opt-in (TMDQA_RUN_HEAVY_BENCH) and is run at release, not here.
#   - Always, beside whichever of those runs: core-without-qt, a hosted job that never
#     installs Qt and builds and tests the native core, its doctest suite and the C#
#     library there (plan step 2.4). The `ci` status needs both.
#
# Windows steps use `shell: powershell` (Windows PowerShell 5.1), NOT `pwsh`.
# The self-hosted runner runs as a Windows service under NT AUTHORITY\NETWORK
# SERVICE, and PowerShell 7 is installed here as a per-user MSIX/Store package
# (C:\Program Files\WindowsApps\...) that a service account cannot launch - `pwsh`
# fails with "command not found". Windows PowerShell 5.1 lives in System32 and is
# available to every account, and is present on GitHub-hosted runners too, so both
# CI paths use the same shell. Don't switch these back to pwsh unless PowerShell 7
# is installed machine-wide (MSI, C:\Program Files\PowerShell\7) on the runner.
#
# KEEP THIS FILE PURE ASCII. Windows PowerShell 5.1 reads the temp script GitHub
# writes for each step as Windows-1252, not UTF-8, so a UTF-8 em-dash/arrow decodes
# into bytes that include a smart quote - which 5.1 treats as a string delimiter and
# the step dies with "The string is missing the terminator". Use -, ->, "..." only.
#
# The pick-runner job routes to self-hosted only when that runner is actually
# ONLINE - otherwise (runner offline, or a contributor without the runner) it falls
# back to hosted. Detecting the runner's status needs an admin token, which the
# default GITHUB_TOKEN lacks, so it uses an OPTIONAL secret RUNNER_ADMIN_TOKEN
# (fine-grained PAT, repository "Administration: read"). Without that secret CI
# always uses the hosted fallback - safe, zero-config, works for every contributor.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Qt version. env.ps1 (self-hosted) and install-qt-action (hosted) both read it, so
# it stays the single knob; it must match the Qt kit installed on the self-hosted runner.
env:
  QT_VERSION: '6.12.0'

jobs:
  # --- Decide which runner to use -------------------------------------------
  pick-runner:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.pick.outputs.target }}
    steps:
      - id: pick
        env:
          # Optional: a fine-grained PAT with repo "Administration: read" enables
          # routing to the self-hosted runner when it is online. Absent -> hosted.
          RUNNER_ADMIN_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
        run: |
          target=hosted
          if [ -z "$RUNNER_ADMIN_TOKEN" ]; then
            echo "::notice title=Runner routing::RUNNER_ADMIN_TOKEN is not set, so the hosted fallback is used."
          else
            # Keep the HTTP status and GitHub's own message (never the token), so a fallback says WHY:
            # 401 or 403 usually means the token has expired or lacks "Administration: read" on this repository.
            status=$(curl -s -o runners.json -w '%{http_code}' \
              -H "Authorization: Bearer $RUNNER_ADMIN_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runners" || true)
            if [ "$status" = "200" ]; then
              online=$(jq '[.runners[]? | select(.status == "online") | select(any(.labels[].name; . == "tmdqa"))] | length' runners.json 2>/dev/null) || online=0
              echo "Runner API answered HTTP 200; ${online:-0} runner(s) with the tmdqa label are online."
              if [ "${online:-0}" -ge 1 ]; then target=self-hosted; fi
            else
              echo "::warning title=Runner routing::The runner API answered HTTP ${status:-none}, so the hosted fallback is used. 401 or 403 usually means RUNNER_ADMIN_TOKEN has expired or lacks Administration: read on this repository."
              if [ -s runners.json ]; then echo "GitHub says: $(jq -r '.message // empty' runners.json 2>/dev/null)"; fi
            fi
            rm -f runners.json
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "Selected CI runner: $target"

  # --- Preferred: self-hosted (local toolchain + fixtures) -----------------
  build-self-hosted:
    needs: pick-runner
    if: needs.pick-runner.outputs.target == 'self-hosted'
    runs-on: [self-hosted, windows, tmdqa]
    steps:
      - name: Checkout
        # Default clean:true restores the committed sample fixtures and removes
        # stale gitignored build outputs (build/, tests\debug, .qmake.stash) each
        # run - persistent-runner hygiene, handled for us.
        uses: actions/checkout@v4

      - name: Release consistency (version literals)
        shell: powershell
        run: |
          # Four user-facing files carry the version as prose; nothing derives them
          # from AppVersion, and each has shipped stale. Needs no toolchain, so it
          # runs before the build and fails fast. -ReleaseMode is deliberately NOT
          # passed: an "Unreleased" changelog section is correct between releases and
          # is only an error at packaging time (build_release.ps1 passes it there).
          powershell -ExecutionPolicy Bypass -File scripts\check_release_consistency.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Toolchain versions
        shell: powershell
        run: |
          # PS 5.1 turns native-tool stderr into a terminating NativeCommandError
          # (e.g. cl's banner). Failures are gated by explicit $LASTEXITCODE checks.
          $ErrorActionPreference = 'Continue'
          . .\scripts\env.ps1
          qmake --version
          cmd /c "cl 2>&1" | Select-Object -First 1
          # cl exits non-zero when given no input file, and GitHub appends
          # "exit $LASTEXITCODE" to powershell steps - this step is informational,
          # so end it explicitly successful.
          exit 0

      - name: Build app (Debug)
        shell: powershell
        run: |
          # PS 5.1 turns native-tool stderr into a terminating NativeCommandError
          # (e.g. cl's banner). Failures are gated by explicit $LASTEXITCODE checks.
          $ErrorActionPreference = 'Continue'
          . .\scripts\env.ps1
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Set-Location build
          qmake ..\tmDataQualityAnalyzer.pro -spec win32-msvc 'CONFIG+=debug'
          # jom is nmake's parallel drop-in (same -f syntax, one job per core).
          # env.ps1 selects it on the self-hosted runner; the hosted runner has no
          # jom, so fall back to nmake there rather than failing the job.
          $make = if ($env:TMDQ_MAKE) { $env:TMDQ_MAKE } elseif (Get-Command jom -ErrorAction SilentlyContinue) { 'jom' } else { 'nmake' }
          Write-Host "Building with $make"
          & $make -f Makefile.Debug 2>&1 | Tee-Object -FilePath app_build.log
          if ($LASTEXITCODE -ne 0) { throw "App build failed ($LASTEXITCODE)" }

      - name: Build tests (Debug, in-source)
        shell: powershell
        run: |
          # PS 5.1 turns native-tool stderr into a terminating NativeCommandError
          # (e.g. cl's banner). Failures are gated by explicit $LASTEXITCODE checks.
          $ErrorActionPreference = 'Continue'
          . .\scripts\env.ps1
          Set-Location tests
          qmake tests.pro -spec win32-msvc 'CONFIG+=debug'
          $make = if ($env:TMDQ_MAKE) { $env:TMDQ_MAKE } elseif (Get-Command jom -ErrorAction SilentlyContinue) { 'jom' } else { 'nmake' }
          Write-Host "Building with $make"
          & $make -f Makefile.Debug 2>&1 | Tee-Object -FilePath tests_build.log
          if ($LASTEXITCODE -ne 0) { throw "Test build failed ($LASTEXITCODE)" }

      - name: Zero-warning gate (app + tests)
        shell: powershell
        run: |
          # PS 5.1 turns native-tool stderr into a terminating NativeCommandError
          # (e.g. cl's banner). Failures are gated by explicit $LASTEXITCODE checks.
          $ErrorActionPreference = 'Continue'
          # Runs after BOTH builds so one report lists every warning to fix. The gate
          # used to check only the app log, so warnings in tests/ code were never
          # gated even though the zero-warning policy covers them.
          $logs = @('build\app_build.log', 'tests\tests_build.log')
          # A missing log means the gate would scan nothing and "pass" - fail instead,
          # or a renamed tee target silently disables the whole gate.
          $missing = $logs | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "Cannot verify: build log(s) missing - $($missing -join ', ')" }
          $dirty = $false
          foreach ($log in $logs) {
            $warns = Select-String -Path $log -Pattern 'warning [A-Z]\d+'
            if ($warns) {
              $dirty = $true
              Write-Host "Compiler warnings in ${log}:"
              $warns | ForEach-Object { Write-Host "  $($_.Line)" }
            }
          }
          if ($dirty) { throw "Build is not warning-clean" }
          Write-Host "No warnings (app + tests)."

      - name: Build native core (tmdq_core.dll, no Qt)
        shell: powershell
        run: |
          # The same core sources the Qt build compiles, built by MSBuild (tmdq.sln) with no Qt
          # include path, then checked: zero warnings, and the DLL's imports on an allow-list.
          # PS 5.1 turns native-tool stderr into a terminating NativeCommandError, so failures
          # are gated by explicit $LASTEXITCODE checks.
          $ErrorActionPreference = 'Continue'
          foreach ($cfg in 'Debug', 'Release') {
            powershell -ExecutionPolicy Bypass -File scripts\build_core_dll.ps1 -Configuration $cfg
            if ($LASTEXITCODE -ne 0) { throw "tmdq_core.dll ($cfg) failed the build or the no-Qt check" }
          }

      - name: Native tests (doctest, no Qt)
        shell: powershell
        run: |
          # The core's own tests, ported off Qt Test in plan step 2.4: doctest, built by MSBuild
          # with no Qt on any path. The script requires zero compiler warnings and no Qt import, then runs them.
          $ErrorActionPreference = 'Continue'
          powershell -ExecutionPolicy Bypass -File scripts\test_native.ps1 -Configuration Release
          if ($LASTEXITCODE -ne 0) { throw "the native tests failed" }

      - name: Managed tests (TmDq.Core against the native DLL)
        shell: powershell
        run: |
          # The C# library over the ABI and its xunit tests, run against the Release tmdq_core.dll built by the
          # previous step. The script builds with warnings as errors and merges the UTF-8 code-page manifest
          # into the test exe (mt.exe; it sources env.ps1 when mt is not already on PATH).
          $ErrorActionPreference = 'Continue'
          powershell -ExecutionPolicy Bypass -File scripts\test_dotnet.ps1 -Configuration Release
          if ($LASTEXITCODE -ne 0) { throw "the managed tests failed" }

      - name: App tests (Avalonia, headless)
        shell: powershell
        run: |
          # The Avalonia application (dotnet/TmDq.App) and its tests on the headless platform, which needs no
          # window system: on the self-hosted runner they run as its service account in Session 0 with no
          # desktop, and the script prints the account and session so the log records it. No native DLL needed.
          $ErrorActionPreference = 'Continue'
          powershell -ExecutionPolicy Bypass -File scripts\test_app.ps1 -Configuration Release
          if ($LASTEXITCODE -ne 0) { throw "the app tests failed" }

      - name: Overlay full-size PRN fixture
        shell: powershell
        run: |
          # PS 5.1 turns native-tool stderr into a terminating NativeCommandError
          # (e.g. cl's banner). Failures are gated by explicit $LASTEXITCODE checks.
          $ErrorActionPreference = 'Continue'
          # This step runs AFTER the managed tests on purpose: they pin the committed
          # sample's numbers (116 samples, 1,100 missed frames, ...), and the full
          # recording would change them (and take minutes).
          # The small PRN sample is committed (used by the hosted CI). On this
          # runner, overlay the full-size recording so the heavy throughput
          # benchmark runs the complete data. TMDQA_CH10_FULL is set in the runner's
          # .env; it lives OUTSIDE the checkout, so the copy only reads it. If unset,
          # the committed sample stays (that one benchmark just skips).
          if ($env:TMDQA_CH10_FULL -and (Test-Path $env:TMDQA_CH10_FULL)) {
            Copy-Item $env:TMDQA_CH10_FULL 'tests\data\test files\prn_testfile, sample.ch10' -Force
            Write-Host "Overlaid full PRN from $env:TMDQA_CH10_FULL"
          } else {
            Write-Host "::warning::TMDQA_CH10_FULL not set/found - using the committed sample PRN (heavy benchmark will skip)."
          }

      - name: Run full test suite
        env:
          # Qt's offscreen platform: the self-hosted runner runs as a Windows
          # SERVICE in Session 0, which has no interactive desktop, so a real
          # window can never be exposed and GUI tests that call
          # qWaitForWindowExposed() fail. Offscreen makes the widget tests
          # headless-deterministic; used on both runners so behaviour matches.
          QT_QPA_PLATFORM: offscreen
        shell: powershell
        run: |
          # PS 5.1 turns native-tool stderr into a terminating NativeCommandError
          # (e.g. cl's banner). Failures are gated by explicit $LASTEXITCODE checks.
          $ErrorActionPreference = 'Continue'
          # env.ps1 puts the Qt msvc kit's bin on PATH so the test exe loads Qt6*.dll
          # (each step is a fresh shell - PATH doesn't carry over).
          . .\scripts\env.ps1
          Set-Location tests
          New-Item -ItemType Directory -Force -Path output | Out-Null
          .\debug\tmDataQualityAnalyzer_tests.exe
          $code = $LASTEXITCODE
          $pass = 0; $fail = 0; $skip = 0
          if (Test-Path output\results.txt) {
            $pass = (Select-String -Path output\results.txt -Pattern '^PASS').Count
            $fail = (Select-String -Path output\results.txt -Pattern '^FAIL').Count
            $skip = (Select-String -Path output\results.txt -Pattern '^SKIP').Count
          }
          Write-Host "Results: $pass passed, $fail failed, $skip skipped (exit $code)"
          if ($code -ne 0) { throw "Test suite exited non-zero ($code)" }
          if ($fail -gt 0)  { throw "$fail test(s) failed" }
          # --- Fixture-loss guard -------------------------------------------
          # A skipped test is indistinguishable from a passing one in the totals,
          # and the suite has dozens of QSKIP sites, nearly all of them "fixture not
          # available" guards. So an unpinned skip count is how four integration
          # suites could quietly stop testing anything while CI still reported
          # success. Every .ch10 fixture the suite reads is committed, so both
          # runners must land on NO skips. (The heavy PRN throughput benchmark was
          # the one standing skip; it now lives in the native doctest suite, where
          # it is opt-in and the release script runs it.)
          $skips = @(Select-String -Path output/results.txt -Pattern '^SKIP')
          if ($skips.Count -ne 0) {
            Write-Host "Skipped tests:"
            $skips | ForEach-Object { Write-Host "  $($_.Line)" }
            throw ("Expected no skips but got $($skips.Count) - a test fixture is " +
                   "probably missing")
          }
          Write-Host "Skips: 0 - as expected."
          # Coarse backstop against a run that died partway through.
          if ($pass -lt 350) { throw "Only $pass tests passed - the suite likely aborted partway" }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-self-hosted
          path: tests/output/results.txt
          if-no-files-found: ignore

  # --- Fallback: GitHub-hosted (provisions toolchain; runs committed fixtures) ---
  build-hosted:
    needs: pick-runner
    if: needs.pick-runner.outputs.target == 'hosted'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release consistency (version literals)
        shell: powershell
        run: |
          # Four user-facing files carry the version as prose; nothing derives them
          # from AppVersion, and each has shipped stale. Needs no toolchain, so it
          # runs before the build and fails fast. -ReleaseMode is deliberately NOT
          # passed: an "Unreleased" changelog section is correct between releases and
          # is only an error at packaging time (build_release.ps1 passes it there).
          powershell -ExecutionPolicy Bypass -File scripts\check_release_consistency.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install Qt ${{ env.QT_VERSION }} (MSVC)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Set up MSVC (cl / nmake)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Toolchain versions
        shell: powershell
        run: |
          # PS 5.1 turns native-tool stderr into a terminating NativeCommandError
          # (e.g. cl's banner). Failures are gated by explicit $LASTEXITCODE checks.
          $ErrorActionPreference = 'Continue'
          qmake --version
          cmd /c "cl 2>&1" | Select-Object -First 1
          # cl exits non-zero when given no input file, and GitHub appends
          # "exit $LASTEXITCODE" to powershell steps - this step is informational,
          # so end it explicitly successful.
          exit 0

      - name: Build app (Debug)
        shell: powershell
        run: |
          # PS 5.1 turns native-tool stderr into a terminating NativeCommandError
          # (e.g. cl's banner). Failures are gated by explicit $LASTEXITCODE checks.
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Set-Location build
          qmake ..\tmDataQualityAnalyzer.pro -spec win32-msvc 'CONFIG+=debug'
          # jom is nmake's parallel drop-in (same -f syntax, one job per core).
          # env.ps1 selects it on the self-hosted runner; the hosted runner has no
          # jom, so fall back to nmake there rather than failing the job.
          $make = if ($env:TMDQ_MAKE) { $env:TMDQ_MAKE } elseif (Get-Command jom -ErrorAction SilentlyContinue) { 'jom' } else { 'nmake' }
          Write-Host "Building with $make"
          & $make -f Makefile.Debug 2>&1 | Tee-Object -FilePath app_build.log
          if ($LASTEXITCODE -ne 0) { throw "App build failed ($LASTEXITCODE)" }

      - name: Build tests (Debug, in-source)
        shell: powershell
        run: |
          # PS 5.1 turns native-tool stderr into a terminating NativeCommandError
          # (e.g. cl's banner). Failures are gated by explicit $LASTEXITCODE checks.
          $ErrorActionPreference = 'Continue'
          Set-Location tests
          qmake tests.pro -spec win32-msvc 'CONFIG+=debug'
          $make = if ($env:TMDQ_MAKE) { $env:TMDQ_MAKE } elseif (Get-Command jom -ErrorAction SilentlyContinue) { 'jom' } else { 'nmake' }
          Write-Host "Building with $make"
          & $make -f Makefile.Debug 2>&1 | Tee-Object -FilePath tests_build.log
          if ($LASTEXITCODE -ne 0) { throw "Test build failed ($LASTEXITCODE)" }

      - name: Zero-warning gate (app + tests)
        shell: powershell
        run: |
          # PS 5.1 turns native-tool stderr into a terminating NativeCommandError
          # (e.g. cl's banner). Failures are gated by explicit $LASTEXITCODE checks.
          $ErrorActionPreference = 'Continue'
          # Runs after BOTH builds so one report lists every warning to fix. The gate
          # used to check only the app log, so warnings in tests/ code were never
          # gated even though the zero-warning policy covers them.
          $logs = @('build\app_build.log', 'tests\tests_build.log')
          # A missing log means the gate would scan nothing and "pass" - fail instead,
          # or a renamed tee target silently disables the whole gate.
          $missing = $logs | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "Cannot verify: build log(s) missing - $($missing -join ', ')" }
          $dirty = $false
          foreach ($log in $logs) {
            $warns = Select-String -Path $log -Pattern 'warning [A-Z]\d+'
            if ($warns) {
              $dirty = $true
              Write-Host "Compiler warnings in ${log}:"
              $warns | ForEach-Object { Write-Host "  $($_.Line)" }
            }
          }
          if ($dirty) { throw "Build is not warning-clean" }
          Write-Host "No warnings (app + tests)."

      - name: Build native core (tmdq_core.dll, no Qt)
        shell: powershell
        run: |
          # The same core sources the Qt build compiles, built by MSBuild (tmdq.sln) with no Qt
          # include path, then checked: zero warnings, and the DLL's imports on an allow-list.
          # PS 5.1 turns native-tool stderr into a terminating NativeCommandError, so failures
          # are gated by explicit $LASTEXITCODE checks.
          $ErrorActionPreference = 'Continue'
          foreach ($cfg in 'Debug', 'Release') {
            powershell -ExecutionPolicy Bypass -File scripts\build_core_dll.ps1 -Configuration $cfg
            if ($LASTEXITCODE -ne 0) { throw "tmdq_core.dll ($cfg) failed the build or the no-Qt check" }
          }

      - name: Native tests (doctest, no Qt)
        shell: powershell
        run: |
          # The core's own tests, ported off Qt Test in plan step 2.4: doctest, built by MSBuild
          # with no Qt on any path. The script requires zero compiler warnings and no Qt import, then runs them.
          $ErrorActionPreference = 'Continue'
          powershell -ExecutionPolicy Bypass -File scripts\test_native.ps1 -Configuration Release
          if ($LASTEXITCODE -ne 0) { throw "the native tests failed" }

      - name: Managed tests (TmDq.Core against the native DLL)
        shell: powershell
        run: |
          # The C# library over the ABI and its xunit tests, run against the Release tmdq_core.dll built by the
          # previous step. The script builds with warnings as errors and merges the UTF-8 code-page manifest
          # into the test exe (mt.exe; it sources env.ps1 when mt is not already on PATH).
          $ErrorActionPreference = 'Continue'
          powershell -ExecutionPolicy Bypass -File scripts\test_dotnet.ps1 -Configuration Release
          if ($LASTEXITCODE -ne 0) { throw "the managed tests failed" }

      - name: App tests (Avalonia, headless)
        shell: powershell
        run: |
          # The Avalonia application (dotnet/TmDq.App) and its tests on the headless platform, which needs no
          # window system: on the self-hosted runner they run as its service account in Session 0 with no
          # desktop, and the script prints the account and session so the log records it. No native DLL needed.
          $ErrorActionPreference = 'Continue'
          powershell -ExecutionPolicy Bypass -File scripts\test_app.ps1 -Configuration Release
          if ($LASTEXITCODE -ne 0) { throw "the app tests failed" }

      - name: Run test suite
        env:
          # Qt's offscreen platform: the self-hosted runner runs as a Windows
          # SERVICE in Session 0, which has no interactive desktop, so a real
          # window can never be exposed and GUI tests that call
          # qWaitForWindowExposed() fail. Offscreen makes the widget tests
          # headless-deterministic; used on both runners so behaviour matches.
          QT_QPA_PLATFORM: offscreen
        shell: powershell
        run: |
          # PS 5.1 turns native-tool stderr into a terminating NativeCommandError
          # (e.g. cl's banner). Failures are gated by explicit $LASTEXITCODE checks.
          $ErrorActionPreference = 'Continue'
          Set-Location tests
          New-Item -ItemType Directory -Force -Path output | Out-Null
          .\debug\tmDataQualityAnalyzer_tests.exe
          $code = $LASTEXITCODE
          $pass = 0; $fail = 0; $skip = 0
          if (Test-Path output\results.txt) {
            $pass = (Select-String -Path output\results.txt -Pattern '^PASS').Count
            $fail = (Select-String -Path output\results.txt -Pattern '^FAIL').Count
            $skip = (Select-String -Path output\results.txt -Pattern '^SKIP').Count
          }
          Write-Host "Results: $pass passed, $fail failed, $skip skipped (exit $code)"
          if ($code -ne 0) { throw "Test suite exited non-zero ($code)" }
          if ($fail -gt 0)  { throw "$fail test(s) failed" }
          # --- Fixture-loss guard -------------------------------------------
          # A skipped test is indistinguishable from a passing one in the totals,
          # and the suite has dozens of QSKIP sites, nearly all of them "fixture not
          # available" guards. So an unpinned skip count is how four integration
          # suites could quietly stop testing anything while CI still reported
          # success. Every .ch10 fixture the suite reads is committed, so both
          # runners must land on NO skips. (The heavy PRN throughput benchmark was
          # the one standing skip; it now lives in the native doctest suite, where
          # it is opt-in and the release script runs it.)
          $skips = @(Select-String -Path output/results.txt -Pattern '^SKIP')
          if ($skips.Count -ne 0) {
            Write-Host "Skipped tests:"
            $skips | ForEach-Object { Write-Host "  $($_.Line)" }
            throw ("Expected no skips but got $($skips.Count) - a test fixture is " +
                   "probably missing")
          }
          Write-Host "Skips: 0 - as expected."
          # Coarse backstop against a run that died partway through.
          if ($pass -lt 350) { throw "Only $pass tests passed - the suite likely aborted partway" }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-hosted
          path: tests/output/results.txt
          if-no-files-found: ignore

  # --- The core on a machine that has never had Qt (plan step 2.4) ------------
  # Both build jobs above have Qt on the machine (the self-hosted kit; install-qt-action on
  # hosted), so all they can show is that the core does not REACH for it: no Qt include path,
  # no Qt import. This job is the other half of step 2.4's "done when": the core, its native
  # tests and the managed library build and pass where Qt is not installed at all. It runs on
  # every push and PR whichever runner the Qt build picked, and its first step fails if the
  # image ever gains a Qt, so the proof cannot quietly lapse. Since plan step 3.2 it also builds
  # and tests the Avalonia application, which must never need Qt either.
  core-without-qt:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC (msbuild / dumpbin / mt)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Prove there is no Qt on this machine
        shell: powershell
        run: |
          # Runs after the toolchain steps, so the PATH they built is the one checked. Looks for
          # Qt the ways a build could find it: a qmake or a Qt DLL on PATH, a Qt variable, an
          # install in the usual places.
          $ErrorActionPreference = 'Continue'
          $found = @()
          foreach ($tool in 'qmake', 'qmake6', 'qtpaths', 'windeployqt') {
            $c = Get-Command $tool -ErrorAction SilentlyContinue
            if ($c) { $found += "$tool on PATH: $($c.Source)" }
          }
          foreach ($dir in ($env:PATH -split ';' | Where-Object { $_ -and (Test-Path -LiteralPath $_) })) {
            Get-ChildItem -LiteralPath $dir -Filter 'Qt6Core*.dll' -ErrorAction SilentlyContinue |
              ForEach-Object { $found += "Qt DLL on PATH: $($_.FullName)" }
          }
          # (Not QT_VERSION: the workflow sets it for the Qt jobs, and it installs nothing.)
          Get-ChildItem env: | Where-Object { $_.Name -match '^(QTDIR|QT_ROOT|QT_ROOT_DIR|QT_PLUGIN_PATH|Qt6_DIR)$' } |
            ForEach-Object { $found += "variable $($_.Name)=$($_.Value)" }
          # Each base must be set: an empty one would make "\Qt", which resolves to the drive's root.
          $roots = @('C:\Qt', 'D:\a\Qt')
          foreach ($base in $env:USERPROFILE, $env:RUNNER_WORKSPACE) { if ($base) { $roots += (Join-Path $base 'Qt') } }
          foreach ($root in $roots) {
            if (Test-Path -LiteralPath $root) { $found += "install folder: $root" }
          }
          if ($found.Count -gt 0) {
            $found | ForEach-Object { Write-Host "  $_" }
            throw "This job must run where Qt is not installed, and found $($found.Count) trace(s) of it"
          }
          Write-Host 'No Qt on this machine: no qmake or Qt DLL on PATH, no Qt variable, no install folder.'

      - name: Build native core (tmdq_core.dll)
        shell: powershell
        run: |
          # The scripts dot-source env.ps1 only when msbuild / mt are missing; msvc-dev-cmd put
          # them on PATH, so nothing here touches the Qt half of env.ps1.
          $ErrorActionPreference = 'Continue'
          foreach ($cfg in 'Debug', 'Release') {
            powershell -ExecutionPolicy Bypass -File scripts\build_core_dll.ps1 -Configuration $cfg
            if ($LASTEXITCODE -ne 0) { throw "tmdq_core.dll ($cfg) failed the build or the no-Qt check" }
          }

      - name: Native tests (doctest)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          powershell -ExecutionPolicy Bypass -File scripts\test_native.ps1 -Configuration Release
          if ($LASTEXITCODE -ne 0) { throw "the native tests failed" }

      - name: Managed tests (TmDq.Core against the native DLL)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          powershell -ExecutionPolicy Bypass -File scripts\test_dotnet.ps1 -Configuration Release
          if ($LASTEXITCODE -ne 0) { throw "the managed tests failed" }

      - name: App tests (Avalonia, headless)
        shell: powershell
        run: |
          # The Avalonia application (dotnet/TmDq.App) and its tests on the headless platform, which needs no
          # window system: on the self-hosted runner they run as its service account in Session 0 with no
          # desktop, and the script prints the account and session so the log records it. No native DLL needed.
          $ErrorActionPreference = 'Continue'
          powershell -ExecutionPolicy Bypass -File scripts\test_app.ps1 -Configuration Release
          if ($LASTEXITCODE -ne 0) { throw "the app tests failed" }

  # --- Single stable status: the selected Qt build job AND the Qt-free core both passed ---
  ci:
    needs: [pick-runner, build-self-hosted, build-hosted, core-without-qt]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          sh='${{ needs.build-self-hosted.result }}'
          ho='${{ needs.build-hosted.result }}'
          nq='${{ needs.core-without-qt.result }}'
          echo "target=${{ needs.pick-runner.outputs.target }}  self-hosted=$sh  hosted=$ho  core-without-qt=$nq"
          if [ "$nq" != "success" ]; then
            echo "CI failed - the core did not build and pass without Qt"; exit 1
          fi
          if [ "$sh" = "success" ] || [ "$ho" = "success" ]; then
            echo "CI passed"; exit 0
          fi
          echo "CI failed - the selected build job did not succeed"; exit 1
