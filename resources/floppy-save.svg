<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="s1" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
  </defs>
  <!-- Floppy disk body -->
  <rect x="3" y="2" width="18" height="20" rx="2" ry="2" fill="url(#s1)"/>
  <!-- Top notch (write-protect cutout area) -->
  <rect x="7" y="2" width="10" height="7" rx="1" fill="#FFF8E1" opacity="0.7"/>
  <!-- Label slot on notch -->
  <rect x="9" y="3" width="5" height="1.5" rx="0.5" fill="#FFB300" opacity="0.6"/>
  <!-- Bottom storage area -->
  <rect x="5" y="13" width="14" height="7" rx="1" fill="#FFF8E1" opacity="0.5"/>
  <!-- Disk slot lines -->
  <line x1="7" y1="15" x2="17" y2="15" stroke="#FFB300" stroke-width="0.8" opacity="0.6"/>
  <line x1="7" y1="17" x2="17" y2="17" stroke="#FFB300" stroke-width="0.8" opacity="0.6"/>
</svg>
