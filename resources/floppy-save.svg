<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="s1" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <!-- Floppy disk body -->
  <rect x="3" y="2" width="18" height="20" rx="2" ry="2" fill="url(#s1)"/>
  <!-- Top notch (metal shutter area) -->
  <rect x="7" y="2" width="10" height="7" rx="1" fill="#FFFFFF" opacity="0.8"/>
  <!-- Label slot on notch -->
  <rect x="9" y="3" width="5" height="2" rx="0.5" fill="#1D4ED8" opacity="0.8"/>
  <!-- Bottom storage area (label) -->
  <rect x="5" y="12" width="14" height="8" rx="1" fill="#FFFFFF" opacity="0.9"/>
  <!-- Disk slot lines -->
  <line x1="7" y1="14" x2="17" y2="14" stroke="#1D4ED8" stroke-width="1.0" opacity="0.8"/>
  <line x1="7" y1="16" x2="17" y2="16" stroke="#1D4ED8" stroke-width="1.0" opacity="0.8"/>
  <line x1="7" y1="18" x2="17" y2="18" stroke="#1D4ED8" stroke-width="1.0" opacity="0.8"/>
</svg>
